
<!DOCTYPE html>
<html lang="en">

  <meta charset="utf-8">

<body>
  <header>
    <p class="logo">Felipe Lopez</p>
    <nav>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>

      <li><a href="resume.html">Resume</a></li>
      <li><a href="contact.html">Contact</a></li>
    </nav>
  </header>
   
  <main id="main">
    <h1>Contact Me</h1>
    <div id="form">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      <label for="phone">Phone (optional)</label>
      <input type="tel" id="phone" name="phone">

      <label for="subject">Subject:</label>
      <select id="subject" name="subject" required>
        <option value="">Select a subject</option>
        <option value="job">Job Inquiry</option>
        <option value="feedback">Feedback</option>
        <option value="project">Project Proposal</option>
        <option value="other">Other</option>
      </select>
      <p class="error" id="reason error"></p>

      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="5" required maxlength="500"></textarea>
      <p class="error" id="message-error"></p>

      <input type="submit" id="submit" value="Submit" class="btn">


  
    </div>

  </main>
  <footer>
    
    <p>Created by Felipe Lopez</p>

    </ul>
  </footer>
